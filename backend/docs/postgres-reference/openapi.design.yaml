openapi: 3.0.3
info:
  title: School Admission Management API
  version: 1.0.0
  description: |
    REST API for enquiries, applications, workflow transitions, assessments,
    payments and reporting.

    **Conventions**
    - Base path `/api/v1`. JSON only. Timestamps are ISO-8601 UTC.
    - Auth: OAuth2 / OIDC bearer JWT. Guardians sign in with OTP; the JWT carries a `roles` claim.
    - Errors use RFC 9457 `application/problem+json`.
    - Mutating calls accept an `Idempotency-Key` header; payment calls require it.
    - Applications use optimistic locking: send `If-Match: <version>` on writes; a stale value returns `409`.
    - Lists are cursor-paginated: `?limit=25&cursor=...`.
servers:
  - url: https://api.example-school.in/api/v1
tags:
  - name: Public
  - name: Auth
  - name: Leads
  - name: Applications
  - name: Documents
  - name: Workflow
  - name: Scheduling
  - name: Assessment
  - name: Payments
  - name: Forms and config
  - name: Reports

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------ Public / Auth
  /public/enquiries:
    post:
      tags: [Public]
      summary: Submit an enquiry from the website form or a landing page
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryCreate' }
      responses:
        '201':
          description: Enquiry captured; duplicates are merged into the existing lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a one-time password to a guardian's phone or email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination]
              properties:
                channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
                destination: { type: string, example: '+919812345678' }
      responses:
        '202': { description: OTP sent (always 202 to avoid account enumeration) }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Exchange an OTP for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code]
              properties:
                destination: { type: string }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------- Leads
  /leads:
    get:
      tags: [Leads]
      summary: Search leads
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name or phone }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeadStatus' } }
        - { name: source, in: query, schema: { type: string } }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: followUpBefore, in: query, schema: { type: string, format: date-time }, description: Overdue follow-ups }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of leads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Lead' }
    post:
      tags: [Leads]
      summary: Create a lead manually (walk-in, phone, fair)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }

  /leads/{leadId}/assign:
    post:
      tags: [Leads]
      summary: Assign a lead to a counsellor
      parameters: [{ $ref: '#/components/parameters/LeadId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200': { description: Assigned }

  /leads/{leadId}/followups:
    post:
      tags: [Leads]
      summary: Schedule or log a follow-up
      parameters: [{ $ref: '#/components/parameters/LeadId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueAt]
              properties:
                dueAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201': { description: Created }

  /leads/{leadId}/convert:
    post:
      tags: [Leads]
      summary: Convert a lead into an application draft
      parameters: [{ $ref: '#/components/parameters/LeadId' }]
      responses:
        '201':
          description: Application created at the first workflow stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }

  # ------------------------------------------------------------ Applications
  /applications:
    get:
      tags: [Applications]
      summary: Search applications (staff) or list my applications (guardian)
      parameters:
        - { name: stage, in: query, schema: { type: string, example: REGISTRATION } }
        - { name: classCode, in: query, schema: { type: string } }
        - { name: academicYear, in: query, schema: { type: string, example: 2027-28 } }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Application' }
    post:
      tags: [Applications]
      summary: Start a draft application (guardian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCode, academicYear]
              properties:
                classCode: { type: string }
                academicYear: { type: string }
                campusId: { type: string, format: uuid }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }

  /applications/{applicationId}:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    get:
      tags: [Applications]
      summary: Get an application with its checklist and next actions
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Applications]
      summary: Save draft answers (partial update)
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant: { $ref: '#/components/schemas/Applicant' }
                guardians:
                  type: array
                  items: { $ref: '#/components/schemas/Guardian' }
                responses:
                  type: object
                  additionalProperties: true
                  description: Answers keyed by form field key
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /applications/{applicationId}/submit:
    post:
      tags: [Applications]
      summary: Submit the application form (runs the ENQUIRY to APPLICATION transition)
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResult' }
        '422': { $ref: '#/components/responses/TransitionRejected' }

  /applications/{applicationId}/history:
    get:
      tags: [Applications]
      summary: Stage history and audit trail
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Ordered history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StageHistoryEntry' }

  /applications/{applicationId}/messages:
    get:
      tags: [Applications]
      summary: Communication log for the application
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Messages sent to the guardian
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }

  # ---------------------------------------------------------------- Workflow
  /applications/{applicationId}/transitions:
    post:
      tags: [Workflow]
      summary: Move an application to another stage
      description: |
        The server looks up the configured transition, checks the caller's role,
        evaluates every guard, then runs actions in one transaction.
        If any guard fails, nothing changes and `422` lists each failure.
      parameters:
        - { $ref: '#/components/parameters/ApplicationId' }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TransitionRejected' }

  /applications/{applicationId}/transitions/available:
    get:
      tags: [Workflow]
      summary: Which stages the caller can move to, with live guard status
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    toStage: { type: string, example: REGISTRATION }
                    allowed: { type: boolean }
                    guards:
                      type: array
                      items:
                        type: object
                        properties:
                          key: { type: string, example: DOCS_VERIFIED }
                          passed: { type: boolean }
                          message: { type: string, nullable: true }

  /workflows/{workflowId}:
    get:
      tags: [Workflow]
      summary: Read a workflow with stages, transitions, guards and actions
      parameters:
        - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Workflow definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
    put:
      tags: [Workflow]
      summary: Replace a DRAFT workflow (publish creates a new version)
      parameters:
        - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Workflow' }
      responses:
        '200': { description: Saved }

  # --------------------------------------------------------------- Documents
  /applications/{applicationId}/documents:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    get:
      tags: [Documents]
      summary: List documents and required-document checklist
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Request a pre-signed S3 upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, fileName, contentType, sizeBytes]
              properties:
                docType: { type: string, example: BIRTH_CERT }
                fileName: { type: string }
                contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                sizeBytes: { type: integer, maximum: 5242880 }
      responses:
        '201':
          description: Upload target
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresInSeconds: { type: integer, example: 300 }

  /documents/{documentId}/verification:
    put:
      tags: [Documents]
      summary: Verify or reject a document (staff)
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [VERIFIED, REJECTED] }
                reason: { type: string, description: Required when REJECTED }
      responses:
        '200': { description: Updated }

  # -------------------------------------------------------------- Scheduling
  /interaction-slots:
    get:
      tags: [Scheduling]
      summary: List open slots
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [INTERACTION, CAMPUS_TOUR, ENTRANCE_TEST] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Slots with remaining capacity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }

  /interaction-slots/{slotId}/bookings:
    post:
      tags: [Scheduling]
      summary: Book a slot for an application
      parameters:
        - { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId: { type: string, format: uuid }
      responses:
        '201': { description: Booked }
        '409': { description: Slot is full }

  # -------------------------------------------------------------- Assessment
  /applications/{applicationId}/assessments:
    post:
      tags: [Assessment]
      summary: Record interaction or test scores against the class rubric
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, scores]
              properties:
                kind: { type: string, enum: [INTERACTION, ENTRANCE_TEST] }
                remarks: { type: string }
                scores:
                  type: array
                  items:
                    type: object
                    required: [rubricId, score]
                    properties:
                      rubricId: { type: string, format: uuid }
                      score: { type: number }
      responses:
        '201':
          description: Weighted total and pass/fail computed server-side
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalScore: { type: number, example: 72.5 }
                  passed: { type: boolean }

  # ---------------------------------------------------------------- Payments
  /applications/{applicationId}/invoices:
    get:
      tags: [Payments]
      summary: Invoices for an application
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invoice' }

  /invoices/{invoiceId}/payments:
    post:
      tags: [Payments]
      summary: Create a gateway order for an invoice
      description: Requires `Idempotency-Key`. The client completes payment with the returned gateway data; the stage changes only after the webhook confirms.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { type: string, example: razorpay }
                method: { type: string, enum: [UPI, CARD, NETBANKING] }
      responses:
        '201':
          description: Gateway order
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string, format: uuid }
                  gateway: { type: string }
                  gatewayOrderId: { type: string }
                  amount: { type: number }
                  currency: { type: string, example: INR }
        '409': { description: Invoice already paid }

  /webhooks/payments/{gateway}:
    post:
      tags: [Payments]
      summary: Gateway webhook (HMAC verified, idempotent by event id)
      security: []
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string } }
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Accepted (also returned for duplicates) }
        '401': { description: Invalid signature }

  /payments/{paymentId}/refunds:
    post:
      tags: [Payments]
      summary: Request a refund (accounts approval required)
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number }
                reason: { type: string }
      responses:
        '202': { description: Refund requested }

  # ---------------------------------------------------------- Forms & config
  /forms:
    get:
      tags: [Forms and config]
      summary: List form definitions
      responses:
        '200':
          description: Forms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FormDefinition' }
    post:
      tags: [Forms and config]
      summary: Create a form draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinition' }
      responses:
        '201': { description: Created }

  /forms/{formId}/publish:
    post:
      tags: [Forms and config]
      summary: Publish a form (new immutable version; existing applications keep their version)
      parameters:
        - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published }

  /classes:
    get:
      tags: [Forms and config]
      summary: Classes with age rules, seats and fees for an academic year
      parameters:
        - { name: academicYear, in: query, schema: { type: string } }
      responses:
        '200':
          description: Class configuration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassConfig' }

  # ----------------------------------------------------------------- Reports
  /reports/funnel:
    get:
      tags: [Reports]
      summary: Stage funnel with conversion
      parameters:
        - { name: academicYear, in: query, required: true, schema: { type: string } }
        - { name: classCode, in: query, schema: { type: string } }
        - { name: campusId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reached-count per stage
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    stage: { type: string }
                    reached: { type: integer }
                    conversionFromEnquiry: { type: number, example: 0.42 }

  /reports/sources:
    get:
      tags: [Reports]
      summary: Enquiry-to-admission conversion by source
      parameters:
        - { name: academicYear, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Per-source stats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    enquiries: { type: integer }
                    applications: { type: integer }
                    admitted: { type: integer }

  /reports/counsellors:
    get:
      tags: [Reports]
      summary: Counsellor productivity and overdue follow-ups
      parameters:
        - { name: academicYear, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Per-counsellor stats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId: { type: string, format: uuid }
                    name: { type: string }
                    leadsHandled: { type: integer }
                    admissions: { type: integer }
                    overdueFollowUps: { type: integer }

  /reports/seats:
    get:
      tags: [Reports]
      summary: Seat availability per class
      parameters:
        - { name: academicYear, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Seats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    classCode: { type: string }
                    seatsTotal: { type: integer }
                    seatsUsed: { type: integer }
                    seatsLeft: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The application changed since you loaded it (stale `If-Match` version)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Field validation failed
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        message: { type: string }
    TransitionRejected:
      description: One or more guards failed; nothing was changed
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  failures:
                    type: array
                    items: { type: string }
                    example:
                      - 2 documents not verified yet (Address proof, Previous report card).
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }

    Page:
      type: object
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }

    LeadStatus:
      type: string
      enum: [NEW, CONTACTED, INTERESTED, VISIT_SCHEDULED, CONVERTED, LOST]

    EnquiryCreate:
      type: object
      required: [guardianName, phone, source]
      properties:
        guardianName: { type: string }
        phone: { type: string, example: '+919812345678' }
        email: { type: string, format: email }
        childName: { type: string }
        childDob: { type: string, format: date }
        classCode: { type: string }
        source: { type: string, example: WEBSITE }
        utm:
          type: object
          additionalProperties: { type: string }
        consent:
          type: boolean
          description: Guardian consent to be contacted (required under DPDP)

    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        guardianName: { type: string }
        phone: { type: string }
        childName: { type: string }
        classCode: { type: string }
        source: { type: string }
        status: { $ref: '#/components/schemas/LeadStatus' }
        assignedTo: { type: string, format: uuid, nullable: true }
        nextFollowUpAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Applicant:
      type: object
      required: [fullName, dob]
      properties:
        fullName: { type: string }
        dob: { type: string, format: date }
        gender: { type: string }
        previousSchool: { type: string }

    Guardian:
      type: object
      required: [relation, fullName, phone]
      properties:
        relation: { type: string, example: Mother }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        isPrimary: { type: boolean }

    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicationNo: { type: string, example: APP27-000123 }
        classCode: { type: string }
        stage: { type: string, example: APPLICATION }
        version: { type: integer, format: int64 }
        admissionNo: { type: string, nullable: true }
        applicant: { $ref: '#/components/schemas/Applicant' }
        assignedTo: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }

    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            guardians:
              type: array
              items: { $ref: '#/components/schemas/Guardian' }
            responses:
              type: object
              additionalProperties: true
            documents:
              type: array
              items: { $ref: '#/components/schemas/Document' }
            nextActions:
              type: array
              items: { type: string }
              description: Plain-language steps for the guardian, driven by the current stage

    TransitionRequest:
      type: object
      required: [toStage]
      properties:
        toStage: { type: string, example: REGISTRATION }
        reason: { type: string, description: Required for WAITLISTED and REJECTED }
        expectedVersion: { type: integer, format: int64 }

    TransitionResult:
      type: object
      properties:
        applicationId: { type: string, format: uuid }
        fromStage: { type: string }
        toStage: { type: string }
        version: { type: integer, format: int64 }
        actionsRun:
          type: array
          items: { type: string }
          example: [HOLD_SEAT, ISSUE_INVOICE, NOTIFY]

    StageHistoryEntry:
      type: object
      properties:
        fromStage: { type: string, nullable: true }
        toStage: { type: string }
        actorType: { type: string, enum: [GUARDIAN, STAFF, SYSTEM] }
        actorName: { type: string }
        reason: { type: string, nullable: true }
        at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        channel: { type: string, enum: [WHATSAPP, SMS, EMAIL] }
        template: { type: string }
        status: { type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED] }
        sentAt: { type: string, format: date-time, nullable: true }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        docType: { type: string }
        fileName: { type: string }
        verification: { type: string, enum: [MISSING, UPLOADED, VERIFIED, REJECTED] }
        rejectReason: { type: string, nullable: true }

    Slot:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        remaining: { type: integer }

    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceNo: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [ISSUED, PARTIAL, PAID, CANCELLED, EXPIRED] }
        dueAt: { type: string, format: date-time }

    FormDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        purpose: { type: string, enum: [ENQUIRY, APPLICATION] }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        fields:
          type: array
          items:
            type: object
            required: [fieldKey, label, fieldType, sequence]
            properties:
              fieldKey: { type: string }
              label: { type: string }
              fieldType: { type: string, enum: [TEXT, NUMBER, DATE, SELECT, MULTISELECT, PHONE, EMAIL, FILE, CHECKBOX, TEXTAREA] }
              isMandatory: { type: boolean }
              sequence: { type: integer }
              options:
                type: array
                items: { type: string }

    ClassConfig:
      type: object
      properties:
        classCode: { type: string }
        displayName: { type: string }
        minAgeYears: { type: integer }
        seatsTotal: { type: integer }
        seatsLeft: { type: integer }
        passMark: { type: number }
        admissionFee: { type: number }

    Workflow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        stages:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              sequence: { type: integer }
              category: { type: string, enum: [OPEN, HOLD, TERMINAL_SUCCESS, TERMINAL_FAIL] }
        transitions:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              allowedRoles: { type: array, items: { type: string } }
              guardKeys: { type: array, items: { type: string } }
              actionKeys: { type: array, items: { type: string } }
